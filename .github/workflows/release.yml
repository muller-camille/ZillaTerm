name: release

# Publie une version depuis GitHub : Actions → release → Run workflow sur main, avec le numéro X.Y.Z (le tag vX.Y.Z est
# créé sur le commit compilé). « Vérifier sans publier » fait toute la chaîne (tests, compilation, archive, passage d'un
# job à l'autre) sans rien publier, depuis n'importe quelle branche.
# Deux jobs : la compilation, qui exécute le code des paquets NuGet et de SSH.NET patché, n'a qu'un jeton en lecture ;
# seule la publication, qui ne compile rien, peut écrire dans le dépôt. Les actions sont épinglées par commit.
# Relancé pour une version déjà publiée, il met à jour les notes sans remplacer les fichiers, s'ils viennent de ce
# workflow (attestation de provenance) ; sinon il échoue.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Numéro de version X.Y.Z (le tag vX.Y.Z est créé sur main)'
        required: true
        type: string
      dry_run:
        description: 'Vérifier sans publier (depuis n''importe quelle branche)'
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Numéro de version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if ($env:DRY_RUN -ne 'true' -and $env:GITHUB_REF -ne 'refs/heads/main') { throw "Lancez la publication depuis main (et non $env:GITHUB_REF)." }
          $version = $env:INPUT_VERSION.Trim().TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Version invalide : '$version' (attendu X.Y.Z)" }
          "VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT

      # Client Bureau à distance FreeRDP (embarqué dans ZillaTerm) et SSH.NET patché : releases de leurs forks, vérifiées
      # (somme SHA-256 figée, attestation de provenance).
      - name: Binaires des forks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tools/freerdp-download.sh
          bash tools/sshnet-patched.sh

      - name: Tests
        run: dotnet test ZillaTerm.sln -c Release

      - name: Publication (exe autonome win-x64)
        run: >
          dotnet publish src/ZillaTerm.App/ZillaTerm.App.csproj
          -c Release -r win-x64 -p:SelfContained=true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:Version=${{ env.VERSION }}
          -o publish

      - name: Archive et empreinte
        shell: pwsh
        run: |
          $zip = "ZillaTerm-$env:VERSION-win-x64.zip"
          # Licences du client Bureau à distance embarqué (FreeRDP, OpenSSL, mingw-w64) et ses versions, et du décodeur Brotli
          # du lecteur des écrans enregistrés.
          New-Item -ItemType Directory -Force licenses | Out-Null
          Copy-Item local-packages/freerdp/LICENSE.*.txt, local-packages/freerdp/BUILD.txt licenses/
          Copy-Item src/ZillaTerm.Core/Interventions/Player/LICENSE.brotli.txt licenses/
          Rename-Item licenses/BUILD.txt FreeRDP-BUILD.txt
          Compress-Archive -Path publish/ZillaTerm.exe, LICENSE, licenses -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Out-File -FilePath SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: |
            ZillaTerm-${{ env.VERSION }}-win-x64.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      # Attestation de provenance de l'archive (Sigstore, jeton OIDC du workflow).
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: v${{ needs.build.outputs.version }}
    steps:
      # Pour les notes de version seulement : rien n'est compilé ni exécuté depuis le dépôt dans ce job.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Fichiers compilés
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release --dir .
          sha256sum -c SHA256SUMS.txt
          test -f "ZillaTerm-$VERSION-win-x64.zip"

      # Attestation de provenance : prouve que l'archive a été compilée par ce workflow, sur ce dépôt et ce commit.
      # Vérification : gh attestation verify ZillaTerm-X.Y.Z-win-x64.zip --repo muller-camille/ZillaTerm
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        if: ${{ !inputs.dry_run }}
        with:
          subject-path: ZillaTerm-${{ env.VERSION }}-win-x64.zip

      - name: Release GitHub
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "docs/releases/$env:TAG.md"
          $zip = "ZillaTerm-$env:VERSION-win-x64.zip"
          $files = @($zip, "SHA256SUMS.txt")
          $existing = @(gh release list --limit 200 --json tagName | ConvertFrom-Json | ForEach-Object tagName)
          if ($existing -contains $env:TAG) {
            # Release déjà existante (relance pour corriger les notes, ou release créée à la main) : ses fichiers ne sont
            # gardés que s'ils viennent de ce workflow. Une archive déposée à la main (sans attestation de ce workflow) ou
            # un fichier inattendu fait échouer la publication au lieu d'être conservé.
            $published = @(gh release view $env:TAG --json assets | ConvertFrom-Json | ForEach-Object { $_.assets.name })
            $unexpected = @($published | Where-Object { $files -notcontains $_ })
            if ($unexpected.Count -gt 0) { throw "La release $env:TAG contient des fichiers inattendus : $($unexpected -join ', '). Supprimez-la puis relancez." }
            if ($published.Count -eq 0) {
              gh release upload $env:TAG @files
            } elseif ($published.Count -ne $files.Count) {
              throw "La release $env:TAG est incomplète ($($published -join ', ')). Supprimez-la puis relancez."
            } else {
              New-Item -ItemType Directory -Force published | Out-Null
              gh release download $env:TAG --dir published
              gh attestation verify "published/$zip" --repo $env:GITHUB_REPOSITORY --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/release.yml"
              if ($LASTEXITCODE -ne 0) { throw "L'archive publiée pour $env:TAG ne vient pas de ce workflow (pas d'attestation de provenance). Supprimez la release puis relancez." }
              Push-Location published
              sha256sum -c SHA256SUMS.txt
              $sums = $LASTEXITCODE
              Pop-Location
              if ($sums -ne 0) { throw "SHA256SUMS.txt publié pour $env:TAG ne correspond pas à l'archive publiée." }
            }

            if (Test-Path $notes) { gh release edit $env:TAG --notes-file $notes }
          } else {
            # Le tag est créé sur le commit compilé s'il n'existe pas encore.
            $options = @('--title', "ZillaTerm $env:VERSION", '--target', $env:GITHUB_SHA)
            if (Test-Path $notes) { $options += @('--notes-file', $notes) } else { $options += '--generate-notes' }
            gh release create $env:TAG @files @options
          }

      - name: Vérification sans publication
        if: ${{ inputs.dry_run }}
        run: |
          echo "Vérification terminée pour $TAG ($GITHUB_SHA) : rien n'a été publié."
