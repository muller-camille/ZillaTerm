name: release

# Publie une version depuis GitHub : Actions → release → Run workflow sur main, avec le numéro X.Y.Z (le tag vX.Y.Z est
# créé sur le commit compilé). « Vérifier sans publier » fait toute la chaîne (tests, compilation, archive, passage d'un
# job à l'autre) sans rien publier, depuis n'importe quelle branche.
# Deux jobs : la compilation, qui exécute le code des paquets NuGet et du fork SSH.NET, n'a qu'un jeton en lecture ;
# seule la publication, qui ne compile rien, peut écrire dans le dépôt. Les actions sont épinglées par commit.
# Relancé pour une version déjà publiée, il met à jour les notes sans remplacer les fichiers.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Numéro de version X.Y.Z (le tag vX.Y.Z est créé sur main)'
        required: true
        type: string
      dry_run:
        description: 'Vérifier sans publier (depuis n''importe quelle branche)'
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  # Client Bureau à distance FreeRDP, toujours recompilé pour une publication (pas de cache).
  freerdp:
    permissions:
      contents: read
    uses: ./.github/workflows/freerdp.yml
    with:
      use-cache: false

  build:
    needs: freerdp
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Numéro de version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if ($env:DRY_RUN -ne 'true' -and $env:GITHUB_REF -ne 'refs/heads/main') { throw "Lancez la publication depuis main (et non $env:GITHUB_REF)." }
          $version = $env:INPUT_VERSION.Trim().TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Version invalide : '$version' (attendu X.Y.Z)" }
          "VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT

      # SSH.NET 2026.0.0 patché (noms du propriétaire et du groupe en SFTP), compilé depuis le fork à un commit figé.
      # Client Bureau à distance FreeRDP (freerdp.yml), embarqué dans ZillaTerm.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: freerdp
          path: local-packages/freerdp

      - name: SSH.NET patché
        shell: bash
        run: bash tools/sshnet-patched.sh

      - name: Tests
        run: dotnet test ZillaTerm.sln -c Release

      - name: Publication (exe autonome win-x64)
        run: >
          dotnet publish src/ZillaTerm.App/ZillaTerm.App.csproj
          -c Release -r win-x64 -p:SelfContained=true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:Version=${{ env.VERSION }}
          -o publish

      - name: Archive et empreinte
        shell: pwsh
        run: |
          $zip = "ZillaTerm-$env:VERSION-win-x64.zip"
          # Licences du client Bureau à distance embarqué (FreeRDP, OpenSSL, mingw-w64) et ses versions.
          New-Item -ItemType Directory -Force licenses | Out-Null
          Copy-Item local-packages/freerdp/LICENSE.*.txt, local-packages/freerdp/BUILD.txt licenses/
          Rename-Item licenses/BUILD.txt FreeRDP-BUILD.txt
          Compress-Archive -Path publish/ZillaTerm.exe, LICENSE, licenses -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Out-File -FilePath SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: |
            ZillaTerm-${{ env.VERSION }}-win-x64.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: v${{ needs.build.outputs.version }}
    steps:
      # Pour les notes de version seulement : rien n'est compilé ni exécuté depuis le dépôt dans ce job.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Fichiers compilés
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release --dir .
          sha256sum -c SHA256SUMS.txt
          test -f "ZillaTerm-$VERSION-win-x64.zip"

      - name: Release GitHub
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "docs/releases/$env:TAG.md"
          $files = @("ZillaTerm-$env:VERSION-win-x64.zip", "SHA256SUMS.txt")
          $existing = @(gh release list --limit 200 --json tagName | ConvertFrom-Json | ForEach-Object tagName)
          if ($existing -contains $env:TAG) {
            # Release déjà existante (créée depuis l'interface GitHub, ou relance pour corriger les notes) :
            # on joint seulement les fichiers absents, sans remplacer ceux déjà publiés, puis on met les notes à jour.
            $published = @(gh release view $env:TAG --json assets | ConvertFrom-Json | ForEach-Object { $_.assets.name })
            $missing = @($files | Where-Object { $published -notcontains $_ })
            if ($missing.Count -gt 0) { gh release upload $env:TAG @missing }
            if (Test-Path $notes) { gh release edit $env:TAG --notes-file $notes }
          } else {
            # Le tag est créé sur le commit compilé s'il n'existe pas encore.
            $options = @('--title', "ZillaTerm $env:VERSION", '--target', $env:GITHUB_SHA)
            if (Test-Path $notes) { $options += @('--notes-file', $notes) } else { $options += '--generate-notes' }
            gh release create $env:TAG @files @options
          }

      - name: Vérification sans publication
        if: ${{ inputs.dry_run }}
        run: |
          echo "Vérification terminée pour $TAG ($GITHUB_SHA) : rien n'a été publié."
